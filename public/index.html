<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 400px;
        margin: 60px auto;
      }
      input {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        padding: 8px 16px;
      }
      #message {
        margin-top: 15px;
      }
      #message.error {
        color: red;
      }
      #message.success {
        color: green;
      }
    </style>
  </head>
  <body>
    <h2>Login</h2>
    <form id="login-form">
      <input type="text" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button type="submit" id="login-button" disabled>Login</button>
    </form>
    <div id="message"></div>

    <script src="script.js"></script>
  </body>
</html>
